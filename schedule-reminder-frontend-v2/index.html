<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schedule Reminder</title><link rel="stylesheet" href="style.css"></head><body>
<aside><div class="brand"><b>SR</b><span>Schedule<br><small>Reminder</small></span></div><nav><button class="active" data-view="time">▦ Timetable</button><button data-view="routine">◫ Routines</button></nav><footer>● Personal schedule</footer></aside>
<main><header><div><label>SCHEDULE REMINDER</label><h1 id="title">Timetable</h1><p id="sub">Your reminders, organised day by day.</p></div><button id="new" class="primary">+ New reminder</button></header>
<p id="status"></p>
<section id="time"><div id="days"></div><div class="sectionHead"><div><small id="date"></small><h2 id="day"></h2></div><button id="refresh">Refresh</button></div><div id="cards"></div></section>
<section id="routine" class="hide"><div class="sectionHead"><div><small>SUBJECT-WISE</small><h2>Your routines</h2></div><input id="search" placeholder="Search subjects..."></div><div id="routines"></div></section></main>
<dialog id="dlg"><form id="form" method="dialog"><div class="dialogHead"><h2 id="dialogTitle">New reminder</h2><button type="button" id="close">×</button></div><input type="hidden" id="rid"><label>Title<input id="rt" required maxlength="100"></label><label>Description<textarea id="rd" rows="3"></textarea></label><label>Deadline<input id="deadline" type="datetime-local" required></label><label>Repeat<select id="repeat"><option value="NONE">None</option><option value="DAILY">Daily</option><option value="WEEKLY">Weekly</option><option value="MONTHLY">Monthly</option></select></label><label>Subject<select id="subject"><option value="">Select subject</option></select></label><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary">Save reminder</button></div></form></dialog>
<script src="script.js"></script></body></html>
